<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แผนลดน้ำหนักพยาบาลเข้าเวร</title>
<meta name="description" content="วางแผนลดน้ำหนักตามเวรพยาบาล คำนวณพลังงาน เมนู วัตถุดิบ และติดตามผล">
<meta name="theme-color" content="#0c7366">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ลดน้ำหนัก">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one app column; sticky top bar; pill tabs on desktop, bottom tab bar on phones. Calm clinical palette: deep teal on cool paper, soft elevated cards. */
:root{
  --bg:#f1f4f3; --surface:#ffffff; --surface-2:#f7f9f8; --ink:#11201d; --muted:#5a6966; --line:#e1e8e6;
  --accent:#0c7366; --accent-2:#0a5f55; --accent-soft:#e2f2ee; --accent-ink:#ffffff;
  --good:#17803d; --warn:#a85d06; --bad:#b42323;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --plan:#7a8784;
  --shadow:0 1px 2px rgba(17,32,29,.05),0 6px 20px rgba(17,32,29,.05);
  --r:16px;
  --font-display:"Prompt","IBM Plex Sans Thai",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1514; --surface:#162120; --surface-2:#1b2826; --ink:#e6efed; --muted:#9db0ac; --line:#273634;
    --accent:#3fb3a6; --accent-2:#5cc6b9; --accent-soft:#18332f; --accent-ink:#06201d;
    --good:#4cc277; --warn:#e3a044; --bad:#f07171;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --plan:#8b9794;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#162120; --surface-2:#1b2826; --ink:#e6efed; --muted:#9db0ac; --line:#273634;
  --accent:#3fb3a6; --accent-2:#5cc6b9; --accent-soft:#18332f; --accent-ink:#06201d;
  --good:#4cc277; --warn:#e3a044; --bad:#f07171;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --plan:#8b9794;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:18px} h2{font-size:17px} h3{font-size:15px}
.wrap{max-width:920px;margin:0 auto;padding:0 16px 48px}
header.top{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.logo svg{width:20px;height:20px}
.brand small{display:block;color:var(--muted);font-size:12px;font-family:var(--font-body);font-weight:400}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)}
nav.tabs{position:sticky;top:58px;z-index:5;display:flex;gap:4px;overflow-x:auto;padding:6px;margin:4px 0 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
nav.tabs a{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--muted);padding:8px 12px;border-radius:10px;font-weight:500;font-size:14px;white-space:nowrap}
nav.tabs a svg{width:18px;height:18px;flex:none}
nav.tabs a:hover{color:var(--ink);background:var(--surface-2)}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
@media (max-width:720px){
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;border-radius:18px 18px 0 0;border-bottom:none;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;overflow:visible}
  nav.tabs a{flex:1 1 0;flex-direction:column;gap:2px;padding:6px 2px;font-size:11px;min-width:0}
  nav.tabs a svg{width:22px;height:22px}
  nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .wrap{padding-bottom:110px}
  header.top{padding-top:calc(10px + env(safe-area-inset-top))}
}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.grid{display:grid;gap:12px}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.cols-3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0;align-content:start;box-shadow:var(--shadow)}
.card.hero{background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.hero-row{display:flex;align-items:center;gap:16px}
.ring{width:84px;height:84px;flex:none}
.big{font-family:var(--font-display);font-size:40px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.unit{font-size:14px;color:var(--muted);font-weight:500;margin-left:4px}
.label{font-size:12px;color:var(--muted);letter-spacing:.02em}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}
button,.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;min-height:40px;border-radius:10px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
button.primary:hover{background:var(--accent-2)}
button.ghost{background:transparent}
button.small,.small button{min-height:32px;padding:4px 10px}
button:disabled{opacity:.5;cursor:not-allowed}
input,select{font:inherit;font-size:15px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;min-width:0}
input:focus,select:focus{background:var(--surface)}
input[type=number]{width:100px}
input.nin{width:72px;padding:5px 6px;font-size:14px;min-height:34px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.cta{display:block;text-align:center;margin-top:12px;padding:14px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:500;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:2px 8px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface-2)}
.chip.OFF{background:transparent;color:var(--muted)}
.chip.M{background:#fff4d6;color:#7a5200;border-color:#efd58d}
.chip.A{background:#e3efff;color:#1d4f91;border-color:#b8d1f3}
.chip.N{background:#e9e4fb;color:#43348f;border-color:#cbc1f0}
.chip.MA,.chip.AN,.chip.NM{background:#fde4e1;color:#8f2a20;border-color:#f2bdb6}
:root[data-theme="dark"] .chip.M{background:#3a2f12;color:#f0cf7a;border-color:#5a4718}
:root[data-theme="dark"] .chip.A{background:#16283f;color:#9cc3f5;border-color:#264466}
:root[data-theme="dark"] .chip.N{background:#241f3d;color:#bdb1f3;border-color:#3b3366}
:root[data-theme="dark"] .chip.MA,:root[data-theme="dark"] .chip.AN,:root[data-theme="dark"] .chip.NM{background:#3b1c19;color:#f3aaa0;border-color:#5e2b25}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .chip.M{background:#3a2f12;color:#f0cf7a;border-color:#5a4718}
  :root:not([data-theme="light"]) .chip.A{background:#16283f;color:#9cc3f5;border-color:#264466}
  :root:not([data-theme="light"]) .chip.N{background:#241f3d;color:#bdb1f3;border-color:#3b3366}
  :root:not([data-theme="light"]) .chip.MA,:root:not([data-theme="light"]) .chip.AN,:root:not([data-theme="light"]) .chip.NM{background:#3b1c19;color:#f3aaa0;border-color:#5e2b25}
}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right}
tr.sel td{background:var(--accent-soft)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:6px;background:var(--surface-2);min-width:0}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--surface)}
.day .d{font-size:12px;color:var(--muted)}
.day select{width:100%;font-size:13px;padding:5px;min-height:34px}
.exlist{display:grid;gap:4px;font-size:12px}
.exlist span{display:flex;justify-content:space-between;gap:4px}
.exlist button{padding:0 6px;font-size:12px;border:none;background:none;color:var(--muted);min-height:0}
@media (max-width:640px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}.big{font-size:34px}}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding:6px 10px;background:var(--surface-2);border-radius:0 8px 8px 0;margin:0}
.note.warn{border-color:var(--warn)}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s;z-index:30}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--series-1);vertical-align:middle;margin-right:6px}
.legend i.plan{border-top:2px dashed var(--plan)}
.ok{color:var(--good)} .warnc{color:var(--warn)} .badc{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:90vw;box-shadow:var(--shadow)}
.toast.show{opacity:1}
@media (max-width:720px){.toast{bottom:96px}}
textarea{font:inherit;width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface-2);color:var(--ink)}
details summary{cursor:pointer;color:var(--accent)}
.macro{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:var(--line)}
.macro i{display:block;height:100%;min-width:2px}
.mp{background:var(--series-1)} .mc{background:var(--series-2)} .mf{background:var(--series-3)}
.macro-legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.macro-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.slots{display:grid;gap:8px}
.slot{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center}
.slot select{width:100%}
.slot-t{font-size:13px;color:var(--muted);font-weight:500}
@media (max-width:520px){.slot{grid-template-columns:1fr;gap:2px}}
.seg{gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.seg button{border-radius:999px;padding:5px 12px;font-size:13px;min-height:34px;white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px;margin:2px 0;background:var(--surface-2)}
.tag button{border:none;padding:0 6px;min-height:0;background:none}
.rest{font-size:12px;color:var(--warn);font-weight:500}
.struck{text-decoration:line-through;opacity:.6}
.wkplan td,.wkplan th{padding:6px}
.wkplan select{max-width:100%;font-size:13px;padding:5px;min-height:34px}
.rgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.rgrid .rc{border:1px solid var(--line);border-radius:8px;padding:4px;display:grid;gap:2px;font-size:12px}
.rgrid .rc select{font-size:12px;padding:3px;width:100%;min-height:30px}
.rgrid .rc.unsure{border-color:var(--warn)}
@media (max-width:520px){.rgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tile{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px}
.tile b{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1.1}
@media (max-width:520px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tile{padding:8px}.tile b{font-size:18px}.tile .label{font-size:11px}.tile .small{font-size:11px}}
.checklist{list-style:none;margin:0;padding:0;display:grid}
.checklist li{display:grid;grid-template-columns:32px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.checklist li:last-child{border-bottom:none}
.chk{width:26px;height:26px;min-height:0;padding:0;border-radius:8px;border:2px solid var(--line);background:var(--surface);position:relative}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.on::after{content:"";position:absolute;left:7px;top:3px;width:7px;height:12px;border:solid var(--accent-ink);border-width:0 3px 3px 0;transform:rotate(45deg)}
.ci-name.done{text-decoration:line-through;color:var(--muted)}
.ci-qty{font-weight:600;text-align:right;display:grid;line-height:1.2}
.ci-qty small{font-weight:400;color:var(--muted);font-size:11px}
.ci-cost{color:var(--muted);font-size:13px;min-width:56px;text-align:right}
.prep{margin:0;padding-left:20px;display:grid;gap:8px}
.shop-preview{max-width:100%;max-height:520px;border-radius:12px;border:1px solid var(--line);justify-self:start}
.cb{position:relative;width:100%;min-width:0}
.cb>select{display:none}
.cb-in{width:100%;text-overflow:ellipsis}
.cb.open .cb-in{border-color:var(--accent);background:var(--surface)}
.cb-list{position:fixed;z-index:45;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:4px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.cb-opt{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1.35}
.cb-opt:hover,.cb-opt.act{background:var(--surface-2)}
.cb-opt.sel{font-weight:600;color:var(--accent)}
.cb-g{font-size:12px;color:var(--muted);padding:8px 10px 2px;font-weight:600}
.cb-empty{padding:10px;color:var(--muted);font-size:13px}
.wkplan .cb{min-width:190px}
.wkplan select.wk-meat{display:block;margin-top:4px;width:100%}
.wkplan .cb+.cb{margin-top:4px}
.meatai{display:grid;gap:8px}
.meatai .nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.meatai .nums input{width:100%}
.eat-row{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.eat-row:last-of-type{border-bottom:none}
.eat-main{display:grid;gap:4px;min-width:0}
.eat-side{display:grid;gap:4px;justify-items:end}
.eat-side select{min-height:34px;padding:4px 6px;font-size:13px}
@media (max-width:520px){.eat-row{grid-template-columns:32px minmax(0,1fr)}.eat-side{grid-column:2;display:flex;justify-content:space-between;align-items:center}}
.howto{display:grid;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.steps{margin:0;padding-left:22px;display:grid;gap:6px}
.steps li::marker{color:var(--accent);font-weight:600}
.acct{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:18px}
pre.report{white-space:pre-wrap;font-family:var(--font-body);font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0;max-height:320px;overflow:auto}
.if-card{margin-bottom:12px}
.if-card.eat{border-color:color-mix(in srgb,var(--good) 45%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--good) 8%,var(--surface)),var(--surface))}
.if-card.fast{border-color:color-mix(in srgb,var(--series-1) 40%,var(--line))}
.if-card.off{box-shadow:none;background:var(--surface-2)}
.if-bar{position:relative;height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.if-bar .w{position:absolute;top:0;bottom:0;background:var(--good);opacity:.85}
.if-bar .now{position:absolute;top:-2px;bottom:-2px;width:3px;margin-left:-1px;background:var(--ink);border-radius:2px}
.if-ticks{display:flex;justify-content:space-between;margin-top:4px}
.season{list-style:none;margin:0;padding:0;display:grid}
.season li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.season li:last-child{border-bottom:none}
tr.grp td{background:var(--surface-2);font-size:12px;font-weight:600;color:var(--accent);padding:5px 8px}
.recipe h3{margin-bottom:4px}
.daystrip{display:flex;gap:4px;align-items:stretch;overflow-x:auto;padding-bottom:2px}
.dchip{flex:1 0 44px;display:grid;justify-items:center;gap:1px;padding:6px 2px;min-height:0;border-radius:12px;background:var(--surface-2)}
.dchip span{font-size:11px;color:var(--muted)} .dchip b{font-size:16px;font-family:var(--font-display)}
.dchip i{font-style:normal;font-size:10px;font-weight:600;border-radius:999px;padding:0 6px;border:1px solid var(--line)}
.dchip.today{border-color:var(--accent)}
.dchip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dchip.on span{color:var(--accent-ink)}
.sd.M{background:#fff4d6;color:#7a5200}.sd.A{background:#e3efff;color:#1d4f91}.sd.N{background:#e9e4fb;color:#43348f}.sd.MA,.sd.AN,.sd.NM{background:#fde4e1;color:#8f2a20}
h3.dish{font-size:18px}
.sides{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
details.side{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2)}

.install{border-color:var(--accent);margin-bottom:12px}

function ifStatus(st,now){
  // now: Date. check today's window and yesterday's (night windows cross midnight)
  const today=ymd(now), mins=now.getHours()*60+now.getMinutes();
  for(const [d,off] of [[addDays(today,-1),-1440],[today,0]]){
    const S=ifSchedule(st,d); if(!S||S.skipped) continue;
    const a=S.startMin+off, b=S.endMin+off;
    if(mins>=a&&mins<b) return {state:'eat',left:b-mins,S};
  }
  const S=ifSchedule(st,today); const T=ifSchedule(st,addDays(today,1));
  if(S&&!S.skipped&&mins<S.startMin) return {state:'fast',until:S.startMin-mins,S};
  if(T&&!T.skipped) return {state:'fast',until:T.startMin+1440-mins,S:T};
  return null;
}

  const rate=(A[A.length-1-k].avg-last)/span; out.rate=rate;

for(const it of ITEMS) if(ITEM_STEPS[it.id]) it.steps=ITEM_STEPS[it.id];
for(const it of ITEMS) if(it.cat==='fruit'&&!it.steps) it.steps=['ล้าง ปอก หั่นเป็นชิ้นพอคำ ใส่กล่องแช่ตู้เย็น กินภายใน 2 วัน'];

<script>
// ---------- State & storage ----------
const TODAY=ymd(new Date());
function defaults(){
  const mon=mondayOf(TODAY);
  const pattern=['M','M','A','N','N','OFF','OFF'];
  const shifts={}; pattern.forEach((s,i)=>shifts[addDays(mon,i)]=s);
  return {
    v:2,
    profile:{sex:'m',age:28,height:170,startWeight:110,goal:65,proteinX:1.5,startDate:TODAY,carbMax:45,rice:'brown'},
    shifts, ex:{}, days:{}, weighed:{}, custom:[], prices:{}, customIng:{}, customMenus:[],
    weights:[{d:TODAY,w:110}], adjust:0, sample:true, eat:{}, customMeats:{}
  };
}
function merge(s){
  const d=defaults();
  const out=Object.assign(d,s,{profile:Object.assign(d.profile,s.profile||{})});
  out.days=out.days||{}; out.custom=out.custom||[]; out.prices=out.prices||{}; out.customIng=out.customIng||{}; out.customMenus=out.customMenus||[];
  registerCustom(out);
  if(s.menu&&!s.v){ for(const k in s.menu){(out.days[k]=out.days[k]||{}).menu=s.menu[k];} }
  delete out.menu; delete out.fixed; delete out.fixedDay; out.v=2;
  out.eat=out.eat||{}; out.customMeats=out.customMeats||{};
  ensureFixed(out,TODAY);
  return out;
}
function load(){try{const s=localStorage.getItem('nurse-weight-v1');return s?merge(JSON.parse(s)):null;}catch(e){return null;}}
let state=ensureFixed(load()||defaults(),TODAY);
registerCustom(state);
let dbRef=null, saving=false, pending=false, saveTimer=null, lastSavedJson=null;
function setStatus(kind,text){const el=document.getElementById('status');el.innerHTML='<span class="dot '+kind+'"></span><span></span>';el.lastChild.textContent=text;}
function save(){
  try{localStorage.setItem('nurse-weight-v1',JSON.stringify(state));}catch(e){}
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(!dbRef) return;
  if(saving){pending=true;return;}
  const json=JSON.stringify(state);
  if(json===lastSavedJson) return;
  saving=true; setStatus('warn','กำลังบันทึก…');
  try{ await dbRef.set({json,updated:Date.now()}); lastSavedJson=json; setStatus('ok','บันทึกในบัญชีแล้ว'); }
  catch(e){ if(e&&e.code==='quota_exceeded') setStatus('warn','พื้นที่เต็ม: ลบข้อมูลเก่าบางส่วน'); else setStatus('warn','บันทึกไม่สำเร็จ เก็บไว้ในเครื่องนี้ก่อน'); }
  saving=false; if(pending){pending=false;flush();}
}
let sampleFn=null, sampleImages=false;
async function initStore(){
  if(!(window.claude&&claude.use)){setStatus('warn','เก็บข้อมูลไว้ในเครื่องนี้เท่านั้น');return;}
  claude.use('downloads').then(dl=>{downloadsApi=dl;}).catch(()=>{});
  claude.use('sample').then(async s=>{ sampleFn=s; if(s){ try{const L=await s.limits(); sampleImages=!!(L&&L.images);}catch(e){} } if(route()==='menu'||route()==='roster') render(); });
  let timer=setTimeout(()=>setStatus('warn','ยังเชื่อมต่อที่เก็บข้อมูลไม่ได้ ใช้ข้อมูลในเครื่องไปก่อน'),10000);
  try{
    const [user,db]=await Promise.all([claude.use('user'),claude.use('db')]);
    const id=user?await user.id():null;
    if(user){ try{ me=await user.me(); if(route()==='profile') render(); }catch(e){} }
    if(!db||!id){clearTimeout(timer);setStatus('warn','เก็บข้อมูลไว้ในเครื่องนี้เท่านั้น');return;}
    dbRef=db.doc('data/users/'+id+'/state');
    dbRef.onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites) return;
      if(!snap.metadata.fromCache){clearTimeout(timer);}
      if(snap.exists){
        const json=snap.data().json;
        if(typeof json==='string'&&json!==JSON.stringify(state)){
          try{state=merge(JSON.parse(json));lastSavedJson=json;try{localStorage.setItem('nurse-weight-v1',json);}catch(e){}render();}catch(e){}
        }
        setStatus('ok','บันทึกในบัญชีแล้ว');
      }else if(!snap.metadata.fromCache){ setStatus('ok','พร้อมบันทึกในบัญชี'); flush(); }
    },err=>{clearTimeout(timer);setStatus('warn','เชื่อมต่อที่เก็บข้อมูลไม่ได้ ใช้ข้อมูลในเครื่องไปก่อน');});
  }catch(e){clearTimeout(timer);setStatus('warn','เก็บข้อมูลไว้ในเครื่องนี้เท่านั้น');}
}
function commit(){state.sample=false;save();render();}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2600);}
function setDay(date,patch){state.days[date]=Object.assign({},state.days[date]||{},patch);}

// ---------- helpers ----------
const $=(s,r=document)=>r.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const fmt=n=>Math.round(n).toLocaleString('th-TH');
const baht=n=>'฿'+Math.round(n).toLocaleString('th-TH');
const THDAY=['อา','จ','อ','พ','พฤ','ศ','ส'];
const THMON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thDate(s,withDay=true){const d=parseYmd(s);return (withDay?THDAY[d.getDay()]+' ':'')+d.getDate()+' '+THMON[d.getMonth()];}
function chip(sh){return '<span class="chip '+sh+'" title="'+esc(SHIFTS[sh].full)+'">'+SHIFTS[sh].t+'</span>';}
let rosterAi={file:null,url:null,busy:false,res:null,err:'',name:'',month:TODAY.slice(0,7)};
let selDate=TODAY, rosterWeek=mondayOf(TODAY), weighMode=false, catFilter='', photo={file:null,url:null,busy:false,res:null,err:''}, aiMenu={busy:false,res:null,err:'',q:''};
const SLOT_T={bf:'มื้อแรก',m1:'มื้อหลัก 1',m2:'มื้อหลัก 2',s1:'อาหารว่าง',s2:'ว่าง 2',drink:'เครื่องดื่ม'};

function itemOptions(sel,cats,{none=true,home=false,homeLabel=''}={}){
  const all=allItems(state);
  let h='';
  if(home) h+=`<option value="home" ${sel==='home'?'selected':''}>${esc(homeLabel)}</option>`;
  if(none) h+=`<option value="" ${!sel?'selected':''}>— ไม่กิน —</option>`;
  for(const c of cats){const list=all.filter(i=>i.cat===c);if(!list.length)continue;
    h+=`<optgroup label="${esc(ITEM_CATS[c])}">`+list.map(i=>{const m=itemM(i);return `<option value="${i.id}" ${i.id===sel?'selected':''}>${esc(i.n)} · ${Math.round(m.k)} kcal · P ${Math.round(m.p)}${i.price?` · ${baht(i.price)}`:''}</option>`;}).join('')+'</optgroup>';}
  return h;
}
function macroBar(P){
  const t=P.tot, pc=P.pct, cm=Number(state.profile.carbMax)||0;
  return `<div class="macro" role="img" aria-label="สัดส่วนพลังงาน โปรตีน ${pc.p.toFixed(0)}% คาร์โบไฮเดรต ${pc.c.toFixed(0)}% ไขมัน ${pc.f.toFixed(0)}%">
    <i class="mp" style="width:${pc.p}%"></i><i class="mc" style="width:${pc.c}%"></i><i class="mf" style="width:${pc.f}%"></i></div>
    <div class="macro-legend small">
      <span><i class="mp"></i>โปรตีน <b class="num">${Math.round(t.p)} ก.</b> · ${pc.p.toFixed(0)}%</span>
      <span><i class="mc"></i>คาร์โบไฮเดรต <b class="num">${Math.round(t.c)} ก.</b> · ${pc.c.toFixed(0)}%${cm?` <span class="muted">(เพดาน ${cm}%)</span>`:''}</span>
      <span><i class="mf"></i>ไขมัน <b class="num">${Math.round(t.f)} ก.</b> · ${pc.f.toFixed(0)}%</span>
    </div>`;
}
const PX_OPTS=[1.0,1.2,1.4,1.5,1.6,1.8,2.0,2.2];

// ---------- views ----------
function viewToday(){
  const P=planDay(state,TODAY), E=P.E;
  const w=E.w, p=state.profile;
  const exs=state.ex[TODAY]||[];
  const bmi=p.height?w/((p.height/100)**2):null;
  const meal=(slot,id)=>{ if(id==='home') return `<li><b>${SLOT_T[slot]}:</b> ${esc(menuName(P.menu))} (กล่องที่ทำเอง)</li>`; const it=itemById(state,id); return it?`<li><b>${SLOT_T[slot]}:</b> ${esc(it.n)} <span class="muted num">${Math.round(itemM(it).k)} kcal</span></li>`:''; };
  return `
  ${state.sample?`<p class="note warn">ตารางเวรสัปดาห์นี้เป็นตัวอย่าง แก้ให้ตรงกับเวรจริงที่หน้า "ตารางเวร & ออกกำลัง" ส่วนส่วนสูงยังเป็นค่าประมาณ 170 ซม. แก้ได้ที่หน้าโปรไฟล์</p>`:''}
  ${ifBanner()}
  <div class="grid cols-2">
    <section class="card hero">
      <div class="spread"><span class="label">พลังงานที่ควรกินวันนี้ · ${thDate(TODAY)}</span>${chip(E.sh)}</div>
      <div class="hero-row">${ring(P.tot.k,E.target)}<div><span class="big num">${fmt(E.target)}</span><span class="unit">kcal</span><div class="small muted">เป้าวันนี้</div></div></div>
      <div class="small muted">ใช้ไป ${fmt(E.tdee)} kcal (${esc(SHIFTS[E.sh].full)}${E.noEx?(E.ex?` + เผื่อเท่าวันปกติ ${fmt(E.ex)}`:''):(E.ex?` + ออกกำลัง ${fmt(E.ex)} นับครึ่งหนึ่ง`:'')}) · กินน้อยกว่า ${fmt(E.deficit)} kcal${state.adjust?` · ปรับ ${state.adjust>0?'+':''}${state.adjust}`:''}</div>
      ${macroBar(P)}
      ${eatHeroLine()}
    </section>
    <section class="card">
      <div class="spread"><span class="label">โปรตีนต่อวัน</span>
        <label class="row small">น้ำหนักตัว ${w} กก. ×
          <select id="px-quick" aria-label="ตัวคูณโปรตีน">${PX_OPTS.concat(PX_OPTS.includes(Number(p.proteinX))?[]:[Number(p.proteinX)]).sort((a,b)=>a-b).map(v=>`<option value="${v}" ${Number(p.proteinX)===v?'selected':''}>${v}</option>`).join('')}</select></label></div>
      <div><span class="big num">${E.protein}</span><span class="unit">กรัม</span></div>
      <div class="bar" aria-hidden="true"><i style="width:${clamp(P.tot.p/E.protein*100,0,100)}%"></i></div>
      <div class="small muted">แผนวันนี้ได้ ${Math.round(P.tot.p)} ก.${bmi?` · BMI ${bmi.toFixed(1)}`:''} · คนลดน้ำหนักที่ออกกำลังด้วยเวท ใช้ 1.2–1.6 ก./กก. น้ำหนักตัวก็พอ มากกว่า 2.0 ควรปรึกษาแพทย์ถ้ามีปัญหาไต</div>
    </section>
  </div>
  <div class="grid cols-2" style="margin-top:12px">
    <section class="card">
      <div class="spread"><h2>มื้ออาหารวันนี้</h2><a href="#menu" class="small">เปลี่ยนเมนู / ดูวัตถุดิบ</a></div>
      <ul class="small" style="margin:0;padding-left:18px">${meal('m1',P.ch.m1)}${meal('m2',P.ch.m2)}${meal('s1',P.ch.s1)}${P.ch.drinks.map(id=>meal('drink',id)).join('')}</ul>
      ${portionLine(P)}
      ${ifTodayBlock(E)}
      ${P.notes.map(n=>`<p class="note warn">${esc(n)}</p>`).join('')}
    </section>
    <section class="card">
      <div class="spread"><h2>ออกกำลังกายวันนี้</h2><span class="small muted num">${fmt(E.exFull)} kcal</span></div>
      ${E.noEx?`<p class="note warn">วันนี้${esc(SHIFTS[E.sh].full)} งดออกกำลังกาย พักให้เต็มที่ แต่กินได้เท่าวันปกติ${E.allowance?` (บวกพลังงานเฉลี่ยจากวันที่ออกกำลังของสัปดาห์นี้ให้ ${fmt(E.allowance)} kcal)`:''}</p>`:`

function chartSvg(A){
  if(A.length<1) return '<p class="small muted">ยังไม่มีข้อมูล</p>';
  const W=640,H=260,L=44,R=86,T=14,B=34;
  const goal=state.profile.goal;
  const n0=A[0].avg;
  const weeksSpan=Math.max(daysBetween(A[0].wk,A[A.length-1].wk)/7,1);
  const horizon=Math.max(weeksSpan+4,8);
  const plan=[];for(let i=0;i<=horizon;i++){plan.push({x:i,y:Math.max(goal,n0*Math.pow(1-0.0075,i))});}
  const pts=A.map(a=>({x:daysBetween(A[0].wk,a.wk)/7,y:a.avg,a}));
  const ys=[...pts.map(p=>p.y),...plan.map(p=>p.y)];
  let lo=Math.floor(Math.min(...ys)-1),hi=Math.ceil(Math.max(...ys)+1);
  const step=(hi-lo)>12?5:(hi-lo)>5?2:1; lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
  const sx=x=>L+(x/horizon)*(W-L-R), sy=y=>T+(hi-y)/(hi-lo)*(H-T-B);
  let g='';
  for(let y=lo;y<=hi;y+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${sy(y)}" y2="${sy(y)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${sy(y)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${y}</text>`;}
  const xt=horizon>20?4:horizon>10?2:1;
  for(let i=0;i<=horizon;i+=xt){g+=`<text x="${sx(i)}" y="${H-12}" text-anchor="middle" font-size="11" fill="var(--muted)">${i===0?'เริ่ม':'ส.'+i}</text>`;}
  const planPath=plan.map((p,i)=>(i?'L':'M')+sx(p.x).toFixed(1)+' '+sy(p.y).toFixed(1)).join(' ');
  const actPath=pts.map((p,i)=>(i?'L':'M')+sx(p.x).toFixed(1)+' '+sy(p.y).toFixed(1)).join(' ');
  const lastP=pts[pts.length-1], lastPlan=plan[plan.length-1];
  const dots=pts.map((p,i)=>`<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="${i===pts.length-1?5:4}" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2"/>`).join('');
  const hits=pts.map(p=>`<rect class="hit" x="${sx(p.x)-14}" y="${T}" width="28" height="${H-T-B}" fill="transparent" data-tip="สัปดาห์ ${thDate(p.a.wk,false)}: เฉลี่ย ${p.y.toFixed(1)} กก. (${p.a.n} ครั้ง)" data-x="${sx(p.x)}" data-y="${sy(p.y)}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟน้ำหนักเฉลี่ยรายสัปดาห์เทียบเส้นทางที่ปลอดภัย">${g}
    <path d="${planPath}" fill="none" stroke="var(--plan)" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="${sx(lastPlan.x)+6}" y="${sy(lastPlan.y)+4}" font-size="11" fill="var(--muted)">แผน ${lastPlan.y.toFixed(1)}</text>
    <path d="${actPath}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round"/>${dots}
    <text x="${sx(lastP.x)+9}" y="${sy(lastP.y)-8}" font-size="12" font-weight="600" fill="var(--ink)">${lastP.y.toFixed(1)} กก.</text>${hits}</svg>`;
}

async function runPhoto(){
  if(!sampleFn||!photo.file) return;
  photo.busy=true; photo.err=''; photo.res=null; render();
  const hint=(document.getElementById('photo-hint')||{}).value||'';
  const prompt=`You are a Thai dietitian. The image shows one meal or snack, most likely Thai food from 7-Eleven, a made-to-order shop (ร้านตามสั่ง) or home cooking. If a nutrition label is visible, use its numbers for the whole package. Otherwise estimate portion sizes from the plate, box or utensils and estimate the nutrition of everything visible.
Extra information from the user: ${hint||'none'}
Reply with only a JSON object, in this shape:
{"name":"ชื่ออาหารภาษาไทย","items":[{"name":"ข้าวสวย","grams":180}],"kcal":550,"protein":25,"carbs":70,"fat":18,"confidence":"low|medium|high","note":"หมายเหตุสั้นๆ ภาษาไทย เช่น สมมติว่าผัดน้ำมัน 1 ช้อนโต๊ะ"}
Numbers are for the whole portion shown. Write name, items[].name and note in Thai.`;
  try{
    const r=await sampleFn.json(prompt,{images:[photo.file]});
    if(!r||typeof r!=='object'||!(Number(r.kcal)>0)) throw {code:'invalid_json'};
    photo.res={name:String(r.name||'อาหารจากรูป'),items:Array.isArray(r.items)?r.items.slice(0,8):[],kcal:Number(r.kcal)||0,protein:Number(r.protein)||0,carbs:Number(r.carbs)||0,fat:Number(r.fat)||0,confidence:String(r.confidence||'low'),note:String(r.note||'')};
  }catch(e){
    const c=e&&e.code;
    photo.err=c==='not_granted'?'ยังไม่ได้อนุญาตให้ใช้ Claude ในแอปนี้':c==='rate_limited'?'ใช้งานถี่เกินไป รอสักครู่แล้วลองใหม่':c==='image_rejected'?'รูปนี้ใช้ไม่ได้ ลองถ่ายใหม่ให้เห็นอาหารชัดๆ':c==='refused'?'AI ประเมินรูปนี้ไม่ได้ ลองรูปอื่น':c==='images_unavailable'?'มุมมองนี้ส่งรูปไม่ได้':'ประเมินไม่สำเร็จ ลองใหม่อีกครั้ง';
    if(c==='not_granted'||c==='sampling_disabled'||c==='images_unavailable') sampleImages=false;
  }
  photo.busy=false; render();
}

function autoWeek(wk){
  // pick 7 different built-in menus, alternating cooking methods and main proteins
  const used=new Set(); for(let i=-7;i<0;i++){const d=(state.days||{})[addDays(wk,i)];if(d&&typeof d.menu==='number')used.add(d.menu);}
  const pool=MENUS.map((m,i)=>i).filter(i=>!used.has(i));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const pick=[]; let lastC='',lastP='';
  for(const i of pool){ if(pick.length>=7)break; const m=MENUS[i]; const pk=m.p[0][0]; if(m.c===lastC||pk===lastP) continue; pick.push(i); lastC=m.c; lastP=pk; }
  for(const i of pool){ if(pick.length>=7)break; if(!pick.includes(i)) pick.push(i); }
  pick.forEach((mi,k)=>setDay(addDays(wk,k),{menu:mi}));
}

// ---------- searchable pickers: every <select class="searchable"> gets a type-to-search box ----------
function cbNorm(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').trim(); }
function cbPlace(w){
  const inp=w.querySelector('.cb-in'), list=w.querySelector('.cb-list'); if(!inp||!list) return;
  const r=inp.getBoundingClientRect(); const vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
  const below=vh-r.bottom-8, above=r.top-8, up=below<200&&above>below;
  list.style.left=Math.max(4,r.left)+'px'; list.style.width=Math.max(r.width,Math.min(320,window.innerWidth-8))+'px';
  if(r.left+list.offsetWidth>window.innerWidth-4) list.style.left=Math.max(4,window.innerWidth-4-list.offsetWidth)+'px';
  list.style.maxHeight=Math.max(140,Math.min(340,up?above:below))+'px';
  if(up){ list.style.top=''; list.style.bottom=(window.innerHeight-r.top+4)+'px'; } else { list.style.bottom=''; list.style.top=(r.bottom+4)+'px'; }
}
function enhanceSelects(root){
  (root||document).querySelectorAll('select.searchable:not([data-cb])').forEach(sel=>{
    sel.dataset.cb='1';
    const wrap=document.createElement('div'); wrap.className='cb';
    sel.parentNode.insertBefore(wrap,sel); wrap.appendChild(sel);
    const inp=document.createElement('input'); inp.type='text'; inp.className='cb-in'; inp.autocomplete='off'; inp.spellcheck=false; inp.disabled=sel.disabled;
    inp.setAttribute('role','combobox'); inp.setAttribute('aria-expanded','false'); inp.setAttribute('aria-autocomplete','list');
    inp.setAttribute('aria-label',(sel.getAttribute('aria-label')||'เลือก')+' (พิมพ์เพื่อค้นหา)');
    const list=document.createElement('div'); list.className='cb-list'; list.setAttribute('role','listbox'); list.hidden=true;
    wrap.insertBefore(inp,sel); wrap.appendChild(list);
    const opts=[...sel.querySelectorAll('option')].map(o=>({v:o.value,t:o.textContent,g:o.parentNode.tagName==='OPTGROUP'?o.parentNode.label:'',dis:o.disabled,always:o.dataset.always==='1',qt:o.dataset.qt||''}));
    const curText=()=>{ const o=sel.options[sel.selectedIndex]; return o?o.textContent:''; };
    const show=()=>{ inp.value=curText(); inp.title=inp.value; };
    show();
    let shown=[], act=-1;
    const draw=(q)=>{
      const toks=cbNorm(q).split(' ').filter(Boolean);
      shown=opts.filter(o=>!o.dis&&!o.always&&(!toks.length||toks.every(t=>cbNorm(o.t+' '+o.g).includes(t)))).slice(0,150).concat(opts.filter(o=>o.always));
      let g=null, html='';
      shown.forEach((o,i)=>{ if(o.g!==g){ g=o.g; if(g) html+=`<div class="cb-g">${esc(g)}</div>`; }
        html+=`<div class="cb-opt ${o.v===sel.value?'sel':''} ${i===act?'act':''}" role="option" data-i="${i}" aria-selected="${o.v===sel.value}">${esc(o.always&&o.qt&&q.trim()?o.qt.replace('{q}',q.trim()):o.t)}</div>`; });
      list.innerHTML=html||`<div class="cb-empty">ไม่พบ "${esc(q)}" ลองพิมพ์คำสั้นลง</div>`;
    };
    const open=()=>{ if(!list.hidden) return; list.hidden=false; wrap.classList.add('open'); inp.setAttribute('aria-expanded','true'); inp.placeholder=curText()||'พิมพ์ค้นหา…'; inp.value=''; act=-1; draw(''); cbPlace(wrap);
      const s=list.querySelector('.cb-opt.sel'); if(s) list.scrollTop=Math.max(0,s.offsetTop-list.clientHeight/2); };
    const close=()=>{ if(list.hidden) return; list.hidden=true; wrap.classList.remove('open'); inp.setAttribute('aria-expanded','false'); inp.placeholder=''; show(); };
    wrap._cbClose=close;
    const pick=(o)=>{ sel.dataset.q=list.hidden?'':inp.value; close(); if(!o||o.v===sel.value) return; sel.value=o.v; show(); sel.dispatchEvent(new Event('change',{bubbles:true})); };
    inp.addEventListener('focus',open); inp.addEventListener('click',open);
    inp.addEventListener('input',()=>{ if(list.hidden) open(); act=inp.value?0:-1; draw(inp.value); });
    inp.addEventListener('keydown',e=>{
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(list.hidden) open(); act=clamp(act+(e.key==='ArrowDown'?1:-1),0,shown.length-1); draw(inp.value); const a=list.querySelector('.cb-opt.act'); if(a) a.scrollIntoView({block:'nearest'}); }
      else if(e.key==='Enter'){ e.preventDefault(); if(!list.hidden&&shown[act>=0?act:0]) pick(shown[act>=0?act:0]); }
      else if(e.key==='Escape'){ close(); inp.blur(); }
      else if(e.key==='Tab'){ close(); }
    });
    list.addEventListener('click',e=>{ e.preventDefault(); const el=e.target.closest('.cb-opt'); if(el) pick(shown[Number(el.dataset.i)]); });
  });
}
document.addEventListener('pointerdown',e=>{ document.querySelectorAll('.cb.open').forEach(w=>{ if(!w.contains(e.target)) w._cbClose(); }); });
document.addEventListener('focusin',e=>{ document.querySelectorAll('.cb.open').forEach(w=>{ if(!w.contains(e.target)) w._cbClose(); }); });
const cbReplace=()=>document.querySelectorAll('.cb.open').forEach(cbPlace);
window.addEventListener('scroll',cbReplace,true); window.addEventListener('resize',cbReplace);
if(window.visualViewport) window.visualViewport.addEventListener('resize',cbReplace);

function buildDraftInput(schema,to,subject,body){
  const props=(schema&&schema.properties)||{}; const keys=Object.keys(props);
  const pick=(re,def)=>keys.find(k=>re.test(k))||def;
  const toK=pick(/^to$|recipient/i,'to'), sK=pick(/subject/i,'subject'), bK=pick(/^body$|content|text|message|plain/i,'body');
  const toIsArr=props[toK]?props[toK].type==='array':true;
  return {[toK]:toIsArr?[to]:to,[sK]:subject,[bK]:body};
}
async function sendReportGmail(){
  const to=($('#rep-to')||{}).value||''; if(!/.+@.+\..+/.test(to)){reportMsg='ใส่อีเมลผู้รับให้ถูกต้องก่อน';render();return;}
  state.reportTo=to; save();
  const R=weekReport(reportWeek);
  reportBusy=true; reportMsg=''; render();
  try{
    const mcp=await claude.use('mcp'); if(!mcp) throw {code:'not_granted'};
    let schema=null; try{schema=(await mcp.describeTool('Gmail','create_draft')).inputSchema;}catch(e){}
    try{ await mcp.callTool('Gmail','create_draft',buildDraftInput(schema,to,R.subject,R.body)); }
    catch(e){ if(e&&e.code==='tool_error'&&!schema){ schema=(await mcp.describeTool('Gmail','create_draft')).inputSchema; await mcp.callTool('Gmail','create_draft',buildDraftInput(schema,to,R.subject,R.body)); } else throw e; }
    reportMsg='สร้างอีเมลรายงานในฉบับร่างของ Gmail เรียบร้อย เปิด Gmail แล้วกดส่งได้เลย';
  }catch(e){
    const c=e&&e.code;
    reportMsg=c==='server_not_connected'?'ยังไม่ได้เชื่อม Gmail กับ Claude: ไปที่ claude.ai → Settings → Connectors แล้วเพิ่ม Gmail จากนั้นกดอีกครั้ง':
      c==='needs_reauth'?'การเชื่อม Gmail หมดอายุ: เชื่อมใหม่ที่ claude.ai → Settings → Connectors':
      (c==='not_in_manifest'||c==='approval_required')?'ยังไม่ได้อนุญาตให้แอปนี้ใช้ Gmail กดปุ่มอีกครั้งแล้วเลือกอนุญาต':
      c==='blocked_by_policy'?'องค์กรของคุณไม่อนุญาตให้ใช้ Gmail จากแอปนี้':
      c==='not_granted'||c==='capability_disabled'?'มุมมองนี้เชื่อม Gmail ไม่ได้ ใช้ปุ่มดาวน์โหลดหรือคัดลอกแทน':
      c==='tool_error'?'Gmail ตอบกลับว่าสร้างอีเมลไม่สำเร็จ: '+esc(String(e.message||'').slice(0,160)):
      'สร้างอีเมลไม่สำเร็จ ไม่แน่ใจว่าร่างถูกสร้างหรือยัง ตรวจในกล่องฉบับร่างของ Gmail ก่อนกดอีกครั้ง';
  }
  reportBusy=false; render();
}

async function connectScale(){

async function connectHR(){
  if(!navigator.bluetooth){toast('เบราว์เซอร์นี้ไม่รองรับบลูทูธ ใช้การนำเข้าไฟล์แทน');return;}

    const dev=await navigator.bluetooth.requestDevice({filters:[{services:['heart_rate']}]});
    const srv=await dev.gatt.connect(); const svc=await srv.getPrimaryService('heart_rate');
    const ch=await svc.getCharacteristic('heart_rate_measurement');
    ch.addEventListener('characteristicvaluechanged',ev=>{
      const v=ev.target.value;const f=v.getUint8(0);const bpm=(f&1)?v.getUint16(1,true):v.getUint8(1);hr.bpm=bpm;
      const now=Date.now();
      if(hr.running&&hr.last){const dtMin=(now-hr.last)/60000;const p=state.profile,w=currentWeight(state);
        const gross=p.sex==='f'?(-20.4022+0.4472*bpm-0.1263*w+0.074*p.age)/4.184:(-55.0969+0.6309*bpm+0.1988*w+0.2017*p.age)/4.184;

      hr.last=now; const el=$('#hr-live'); if(el) el.innerHTML=hrLiveText();

function toggleHR(){

function guessType(s){s=(s||'').toLowerCase();if(/run|วิ่ง/.test(s))return 'run';if(/walk|เดิน|hik/.test(s))return 'walk';if(/bik|cycl|ปั่น/.test(s))return 'bike';if(/swim|ว่าย/.test(s))return 'swim';if(/strength|weight|เวท/.test(s))return 'db';return 'walk';}
function parseTCX(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');const out=[];
  doc.querySelectorAll('Activity').forEach(a=>{
    const sport=a.getAttribute('Sport')||'';const id=(a.querySelector('Id')||{}).textContent||'';
    let sec=0,kcal=0;a.querySelectorAll('Lap').forEach(l=>{sec+=Number((l.querySelector('TotalTimeSeconds')||{}).textContent||0);kcal+=Number((l.querySelector('Calories')||{}).textContent||0);});
    if(id) out.push({d:ymd(new Date(id)),type:guessType(sport),min:Math.round(sec/60),kcal:kcal||null});
  });return out;
}
function splitCSV(line){const r=[];let cur='',q=false;for(const c of line){if(c==='"'){q=!q;}else if(c===','&&!q){r.push(cur);cur='';}else cur+=c;}r.push(cur);return r.map(s=>s.trim());}
function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());if(lines.length<2)return[];
  const h=splitCSV(lines[0]).map(s=>s.toLowerCase());
  const iD=h.findIndex(s=>/date|วันที่/.test(s)), iK=h.findIndex(s=>/calor|kcal|แคลอรี่/.test(s)), iT=h.findIndex(s=>/^time$|duration|moving time|elapsed|เวลา/.test(s)), iA=h.findIndex(s=>/activity type|type|sport|ประเภท/.test(s));
  if(iD<0) return [];
  const out=[];
  for(const l of lines.slice(1)){const c=splitCSV(l);const dt=new Date(c[iD]);if(isNaN(dt))continue;
    let min=30;if(iT>=0){const t=c[iT];if(/:/.test(t)){const p=t.split(':').map(Number);min=Math.round(p.length===3?p[0]*60+p[1]+p[2]/60:p[0]+p[1]/60);}else if(t){min=Math.round(Number(t)/(Number(t)>600?60:1));}}
    out.push({d:ymd(dt),type:guessType(iA>=0?c[iA]:''),min:min||30,kcal:iK>=0&&c[iK]?Number(String(c[iK]).replace(/,/g,'')):null});}
  return out;
}
async function importFiles(files){
  let n=0;
  for(const f of files){const t=await f.text();const rows=/\.tcx$|\.xml$/i.test(f.name)?parseTCX(t):parseCSV(t);
    for(const r of rows){const list=(state.ex[r.d]=state.ex[r.d]||[]);if(list.some(e=>e.src==='ไฟล์'&&e.min===r.min&&e.type===r.type))continue;list.push({type:r.type,min:r.min,kcal:r.kcal,src:'ไฟล์'});n++;}}
  commit(); const out=$('#import-out'); if(out) out.textContent=n?`นำเข้า ${n} กิจกรรม ดูได้ที่หน้าตารางเวร`:'ไม่พบกิจกรรมในไฟล์ ตรวจว่าเป็น .tcx หรือ .csv ที่มีคอลัมน์วันที่';
}


// ================= PWA platform layer =================
// Replaces the Claude-hosted capabilities with web equivalents:
//   storage/sync  -> localStorage, plus Firebase Auth (Google) + Firestore when firebase-config.js is filled in
//   AI (sample)   -> Anthropic Messages API, with the user's own key or a proxy URL (see worker/ai-proxy.js)
//   Gmail report  -> Gmail REST API with the Google sign-in token (scope gmail.compose)
//   downloads     -> a normal browser download
const PWA_KEYS={ai:'nwp-ai-settings',gtoken:'nwp-gtoken'};
let fb=null, fbUser=null, gToken=null;
function aiSettings(){ try{return JSON.parse(localStorage.getItem(PWA_KEYS.ai)||'{}');}catch(e){return {};} }
function saveAiSettings(s){ try{localStorage.setItem(PWA_KEYS.ai,JSON.stringify(s));}catch(e){} }
function loadScript(src){ return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s);}); }
const FB_VER='10.12.2';

async function initStore(){
  downloadsApi={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return {status:'saved'};}};
  setupAI();
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey){ setStatus('warn','เก็บข้อมูลไว้ในเครื่องนี้'); return; }
  try{
    await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app-compat.js`);
    await Promise.all([loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-auth-compat.js`),loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore-compat.js`)]);
    fb=firebase.initializeApp(cfg);
    try{ await firebase.firestore().enablePersistence({synchronizeTabs:true}); }catch(e){}
    try{ const r=await firebase.auth().getRedirectResult(); if(r&&r.credential&&r.credential.accessToken) keepToken(r.credential.accessToken); }catch(e){}
    firebase.auth().onAuthStateChanged(u=>{ fbUser=u; me=u?{name:u.displayName||'',email:u.email||'',photo:u.photoURL||''}:null; attachUserDoc(); render(); });
  }catch(e){ setStatus('warn','ต่อ Firebase ไม่ได้ ใช้ข้อมูลในเครื่องไปก่อน'); }
}
let unsubDoc=null;
function attachUserDoc(){
  if(unsubDoc){unsubDoc();unsubDoc=null;} dbRef=null;
  if(!fbUser){ setStatus('warn','ยังไม่ได้เข้าสู่ระบบ ข้อมูลอยู่ในเครื่องนี้'); return; }

        try{state=merge(JSON.parse(json));lastSavedJson=json;try{localStorage.setItem('nurse-weight-v1',json);}catch(e){}render();}catch(e){}
      }

}
async function signInGoogle(withGmail){
  if(!fb){ toast('ยังไม่ได้ตั้งค่า Firebase ดูคู่มือในไฟล์ README'); return null; }
  const p=new firebase.auth.GoogleAuthProvider();
  if(withGmail) p.addScope('https://www.googleapis.com/auth/gmail.compose');
  const standaloneIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)&&(navigator.standalone||matchMedia('(display-mode: standalone)').matches);
  try{
    if(standaloneIOS){ await firebase.auth().signInWithRedirect(p); return null; }
    const r=fbUser?await fbUser.reauthenticateWithPopup(p):await firebase.auth().signInWithPopup(p);
    if(r&&r.credential&&r.credential.accessToken) keepToken(r.credential.accessToken);
    return r;
  }catch(e){
    if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')){ await firebase.auth().signInWithRedirect(p); return null; }
    if(e&&e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request') toast('เข้าสู่ระบบไม่สำเร็จ: '+(e.code||e.message));
    return null;
  }
}
function keepToken(t){ gToken={t,exp:Date.now()+55*60000}; try{sessionStorage.setItem(PWA_KEYS.gtoken,JSON.stringify(gToken));}catch(e){} }
function currentToken(){ if(!gToken){try{gToken=JSON.parse(sessionStorage.getItem(PWA_KEYS.gtoken)||'null');}catch(e){}} return gToken&&gToken.exp>Date.now()?gToken.t:null; }

// ---------- AI: Google Gemini (free tier, default) or Anthropic Claude ----------
function aiProvider(s){ return s.provider||(s.key&&/^sk-ant/.test(s.key)?'claude':'gemini'); }
function callAI(prompt,images){ const s=aiSettings(); return aiProvider(s)==='gemini'&&!s.proxy?callGemini(prompt,images):callClaude(prompt,images); }
async function callGemini(prompt,images){
  const s=aiSettings();
  const parts=[];
  for(const im of (images?(Array.isArray(images)?images:[images]):[])) parts.push({inline_data:{mime_type:'image/jpeg',data:await imgToBase64(im)}});
  parts.push({text:prompt});
  const model=s.gmodel||'gemini-2.5-flash';
  let res;
  try{ res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':s.gkey},body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:{maxOutputTokens:8192,temperature:0.4}})}); }
  catch(e){ throw {code:'upstream_error',message:'ต่ออินเทอร์เน็ตไม่ได้'}; }
  if(res.status===400||res.status===401||res.status===403){ let m='';try{m=(await res.json()).error.message;}catch(e){} if(/API key/i.test(m)||res.status!==400) throw {code:'not_granted',message:'API key ไม่ถูกต้อง'}; throw {code:'upstream_error',message:m||'HTTP 400'}; }
  if(res.status===429) throw {code:'rate_limited',message:'ใช้โควตาฟรีครบแล้ว รอสักครู่หรือพรุ่งนี้'};
  if(!res.ok) throw {code:'upstream_error',message:'HTTP '+res.status};
  const j=await res.json();
  const c=(j.candidates||[])[0];
  if(!c&&j.promptFeedback&&j.promptFeedback.blockReason) throw {code:'refused'};
  const text=((c&&c.content&&c.content.parts)||[]).map(p=>p.text||'').join('');
  if(!text) throw {code:c&&c.finishReason==='SAFETY'?'refused':'empty_completion'};
  return text;
}
function setupAI(){
  const s=aiSettings();
  const ready=s.proxy||(aiProvider(s)==='gemini'?s.gkey:s.key);
  if(!ready){ sampleFn=null; sampleImages=false; return; }
  const fn=async(input,opts)=>({text:await callAI(typeof input==='string'?input:input.map(m=>m.content).join('\n\n'),opts&&opts.images)});
  fn.json=async(prompt,opts)=>parseJsonLoose(await callAI(prompt+'\n\nReply with the JSON only, no other text.',opts&&opts.images));
  fn.limits=async()=>({images:{maxCount:4}});
  sampleFn=fn; sampleImages=true;
}
async function imgToBase64(file){
  const bmp=await createImageBitmap(file);
  const sc=Math.min(1,1568/Math.max(bmp.width,bmp.height));
  const cv=document.createElement('canvas'); cv.width=Math.round(bmp.width*sc); cv.height=Math.round(bmp.height*sc);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85));
  const buf=new Uint8Array(await blob.arrayBuffer()); let bin=''; for(let i=0;i<buf.length;i+=0x8000) bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
  return btoa(bin);
}
async function callClaude(prompt,images){
  const s=aiSettings();
  const content=[];
  for(const im of (images?(Array.isArray(images)?images:[images]):[])) content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await imgToBase64(im)}});
  content.push({type:'text',text:prompt});
  const body=JSON.stringify({model:s.model||'claude-sonnet-5-5',max_tokens:4096,messages:[{role:'user',content}]});
  let res;
  try{
    if(s.proxy) res=await fetch(s.proxy.replace(/\/$/,'')+'/v1/messages',{method:'POST',headers:{'content-type':'application/json',...(s.proxyToken?{'x-app-token':s.proxyToken}:{})},body});
    else res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':s.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body});
  }catch(e){ throw {code:'upstream_error',message:'ต่ออินเทอร์เน็ตไม่ได้'}; }
  if(res.status===401||res.status===403) throw {code:'not_granted',message:'API key ไม่ถูกต้อง'};
  if(res.status===429||res.status===529) throw {code:'rate_limited'};
  if(!res.ok) throw {code:'upstream_error',message:'HTTP '+res.status};
  const j=await res.json();
  const text=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  if(!text) throw {code:'empty_completion'};
  return text;
}
function parseJsonLoose(t){
  try{return JSON.parse(t);}catch(e){}
  const m=t.match(/```(?:json)?\s*([\s\S]*?)```/); if(m){try{return JSON.parse(m[1]);}catch(e){}}
  const a=Math.min(...['{','['].map(c=>{const i=t.indexOf(c);return i<0?Infinity:i;})), b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
  if(a<b){try{return JSON.parse(t.slice(a,b+1));}catch(e){}}
  throw {code:'invalid_json'};
}

// ---------- Gmail report ----------
function b64utf8(s){ const bytes=new TextEncoder().encode(s); let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin); }
function rawMessage(to,subject,body){
  const msg=`To: ${to}\r\nSubject: =?UTF-8?B?${b64utf8(subject)}?=\r\nMIME-Version: 1.0\r\nContent-Type: text/plain; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n${b64utf8(body).replace(/.{76}/g,'$&\r\n')}`;
  return btoa(msg).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function gmailCall(path,payload){
  let tok=currentToken();
  if(!tok){ await signInGoogle(true); tok=currentToken(); }
  if(!tok) throw {code:'no_token'};
  const res=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/'+path,{method:'POST',headers:{'Authorization':'Bearer '+tok,'content-type':'application/json'},body:JSON.stringify(payload)});
  if(res.status===401){ gToken=null; try{sessionStorage.removeItem(PWA_KEYS.gtoken);}catch(e){} throw {code:'expired'}; }
  if(res.status===403) throw {code:'forbidden'};
  if(!res.ok) throw {code:'http',message:'HTTP '+res.status};
  return res.json();
}

  }catch(e){
    const c=e&&e.code;
    reportMsg=c==='no_token'?'ยังไม่ได้อนุญาตให้แอปใช้ Gmail กดปุ่มอีกครั้งแล้วเลือกบัญชี Google และอนุญาต':
      c==='expired'?'สิทธิ์ Gmail หมดอายุ (อยู่ได้ 1 ชั่วโมง) กดปุ่มอีกครั้งเพื่อเข้าสู่ระบบใหม่':
      c==='forbidden'?'Google ไม่อนุญาต: ตรวจว่าเปิด Gmail API และใส่อีเมลนี้เป็น Test user แล้ว (คู่มือข้อ 4)':

  }

function accountCard(){

function remindCfg(){ return Object.assign({beforeClose:45,openLead:0,weeks:4,inapp:false},state.profile.ifRemind||{}); }
function ifEvents(fromDate,days){
  const out=[];
  for(let i=0;i<days;i++){
    const d=addDays(fromDate,i); const S=ifSchedule(state,d);
    if(!S||S.skipped) continue;
    const base=parseYmd(d).getTime();
    out.push({date:d,S,start:new Date(base+S.startMin*60000),end:new Date(base+S.endMin*60000)});
  }
  return out;
}
function icsDate(dt){ const z=n=>String(n).padStart(2,'0'); return dt.getFullYear()+z(dt.getMonth()+1)+z(dt.getDate())+'T'+z(dt.getHours())+z(dt.getMinutes())+'00'; }
function icsEsc(s){ return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function icsFold(line){
  // fold at 75 octets without splitting a character
  // keep Thai vowel/tone marks with their consonant: fold between clusters only
  const enc=new TextEncoder(); const clusters=[];
  for(const ch of line){ if(clusters.length&&/[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/.test(ch)) clusters[clusters.length-1]+=ch; else clusters.push(ch); }
  let out='', cur='', n=0, first=true;
  for(const cl of clusters){ const b=enc.encode(cl).length; if(n+b>(first?75:74)){ out+=(first?'':'\r\n ')+cur; first=false; cur=''; n=0; } cur+=cl; n+=b; }
  return out+(first?'':'\r\n ')+cur;
}
function buildIcs(){
  const c=ifCfg(state), r=remindCfg();
  const evs=ifEvents(TODAY,r.weeks*7);
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//nurse-weight-plan//IF//TH','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:IF ลดน้ำหนัก'];
  for(const e of evs){
    const sh=SHIFTS[e.S.sh];
    const meals=e.S.meals.map(m=>`${m.t} ${m.label}: ${m.note}`).join('\n');
    L.push('BEGIN:VEVENT',`UID:if-${e.date}@nurse-weight-plan`,`DTSTAMP:${stamp}`,`DTSTART:${icsDate(e.start)}`,`DTEND:${icsDate(e.end)}`,
      `SUMMARY:${icsEsc(`ช่วงกิน IF ${c.mode} (${e.S.start}–${e.S.end})`)}`,
      `DESCRIPTION:${icsEsc(`${sh.full}\n${meals}\nระหว่างอดดื่มน้ำเปล่า กาแฟดำ ชาไม่หวานได้`)}`,
      'TRANSP:TRANSPARENT',
      'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc('เปิดช่วงกินแล้ว เริ่มด้วยโปรตีนและผัก')}`,`TRIGGER:${r.openLead?'-PT'+r.openLead+'M':'PT0M'}`,'END:VALARM',
      'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(`อีก ${r.beforeClose} นาทีปิดช่วงกิน กินมื้อปิดให้เสร็จ`)}`,`TRIGGER;RELATED=END:-PT${r.beforeClose}M`,'END:VALARM',
      'END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return {text:L.map(icsFold).join('\r\n')+'\r\n',count:evs.length};
}

let rmTimers=[];
async function notify(title,body){
  try{
    const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
    const opt={body,icon:'icons/icon-192.png',badge:'icons/icon-192.png',tag:'if-'+title,lang:'th'};

}
function scheduleInApp(){
  rmTimers.forEach(clearTimeout); rmTimers=[];
  const r=remindCfg(); if(!r.inapp||!('Notification' in window)||Notification.permission!=='granted'||ifCfg(state).mode==='off') return;
  const now=Date.now();
  for(const e of ifEvents(addDays(TODAY,-1),3)){
    const pts=[[e.start.getTime()-r.openLead*60000,'เปิดช่วงกินแล้ว',`กินได้ถึง ${e.S.end} เริ่มด้วยโปรตีนและผัก`],[e.end.getTime()-r.beforeClose*60000,`อีก ${r.beforeClose} นาทีปิดช่วงกิน`,`กินมื้อปิดให้เสร็จก่อน ${e.S.end}`],[e.end.getTime(),'เริ่มช่วงอด',`ช่วงกินถัดไปดูได้ในแอป ระหว่างอดดื่มน้ำ กาแฟดำ ชาไม่หวานได้`]];
    for(const [t,title,body] of pts){ const dt=t-now; if(dt>0&&dt<24*3600000) rmTimers.push(setTimeout(()=>notify(title,body),dt)); }
  }
}

  if(t.id==='rm-ics'){ const {text,count}=buildIcs(); await downloadsApi.save({filename:'IF-reminders.ics',data:new Blob([text],{type:'text/calendar;charset=utf-8'})}); toast(`สร้างไฟล์ปฏิทิน ${count} วันแล้ว`); }
  else if(t.id==='rm-test'){ notify('ทดสอบแจ้งเตือน IF','ถ้าเห็นข้อความนี้ แปลว่าการแจ้งเตือนใช้งานได้'); }
});
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') scheduleInApp(); });
setTimeout(scheduleInApp,1500);

// ---------- render & events ----------
const ROUTES={today:viewToday,roster:viewRoster,menu:viewMenu,shop:viewShop,progress:viewProgress,profile:viewProfile};
function route(){const h=location.hash.replace('#','');return ROUTES[h]?h:'today';}
function render(){
  const r=route();
  document.querySelectorAll('nav.tabs a').forEach(a=>{if(a.getAttribute('href')==='#'+r)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  const y=window.scrollY;
  $('#view').innerHTML=(typeof preView==='function'?preView(r):'')+ROUTES[r]();
  enhanceSelects($('#view'));
  window.scrollTo(0,y);
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
let dlgDate=null;
document.addEventListener('submit',e=>{
  const f=e.target;
  if(f.classList.contains('exform')){e.preventDefault();const d=f.dataset.date||TODAY;(state.ex[d]=state.ex[d]||[]).push({type:$('.ex-type',f).value,min:Number($('.ex-min',f).value)||30});commit();return;}
  if(f.id==='wform'){e.preventDefault();addWeight(TODAY,$('#w-today').value,$('#waist-today').value);return;}
  if(f.id==='wform2'){e.preventDefault();addWeight($('#w2-date').value,$('#w2-w').value,$('#w2-waist').value);return;}
  if(f.id==='pform'){e.preventDefault();const p=state.profile;p.sex=$('#p-sex').value;p.age=Number($('#p-age').value);p.height=Number($('#p-height').value);p.startWeight=Number($('#p-start').value);p.goal=Number($('#p-goal').value);p.proteinX=Number($('#p-px').value)||1.5;p.carbMax=Number($('#p-carb').value);p.rice=$('#p-rice').value;p.startDate=$('#p-startdate').value||p.startDate;commit();toast('บันทึกแล้ว');return;}
  if(f.id==='bulk'){e.preventDefault();const start=$('#bulk-start').value;const toks=$('#bulk-text').value.trim().split(/[\s,]+/).filter(Boolean);let i=0,bad=[];for(const t of toks){const k=SHIFT_ALIASES[t.toLowerCase()]||SHIFT_ALIASES[t];if(!k){bad.push(t);continue;}state.shifts[addDays(start,i)]=k;i++;}commit();toast(bad.length?`ใส่ ${i} วัน · ข้ามคำที่ไม่รู้จัก: ${bad.join(' ')}`:`ใส่เวรแล้ว ${i} วัน`);return;}
  if(f.id==='exdlg-form'){e.preventDefault();const dlg=$('#exdlg');const k=$('#dlg-kcal').value;const e2={type:$('#dlg-type').value,min:Number($('#dlg-min').value)||30};if(k!==''){e2.kcal=Number(k);e2.src='นาฬิกา';}(state.ex[dlgDate]=state.ex[dlgDate]||[]).push(e2);dlg.close();commit();return;}
  if(f.id==='meatai-form'){e.preventDefault();meatAi.date=meatAi.date||selDate;runMeatAi($('#meatai-q').value);return;}
  if(f.id==='aimenu-form'){e.preventDefault();runAiMenu($('#aimenu-q').value.trim());return;}
  if(f.id==='custom-form'){e.preventDefault();const n=$('#c-n').value.trim();if(!n)return;const it={id:'c_'+Date.now(),cat:'custom',n,m:{k:Number($('#c-k').value)||0,p:Number($('#c-p').value)||0,c:Number($('#c-c').value)||0,f:Number($('#c-f').value)||0}};const pr=Number($('#c-price').value);if(pr)it.price=pr;state.custom.push(it);commit();toast('เพิ่ม "'+n+'" ในรายการของฉันแล้ว เลือกได้ในช่องมื้ออาหาร');return;}
});
function addWeight(d,w,waist){w=Number(w);if(!d||!(w>30&&w<300)){toast('กรอกน้ำหนักระหว่าง 30–300 กก.');return;}state.weights=state.weights.filter(x=>x.d!==d);const e={d,w};if(waist)e.waist=Number(waist);state.weights.push(e);commit();toast('บันทึกน้ำหนัก '+w+' กก. แล้ว');}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.classList.contains('shift-sel')){state.shifts[t.dataset.date]=t.value;commit();}
  else if(t.classList.contains('wk-menu')){setDay(t.dataset.date,{menu:/^cm_/.test(t.value)?t.value:Number(t.value)});commit();}
  else if(t.classList.contains('wk-rice')){setDay(t.dataset.date,{rice:t.value});commit();}
  else if(t.id==='ra-file'){const f=t.files&&t.files[0];if(rosterAi.url)URL.revokeObjectURL(rosterAi.url);rosterAi.name=($('#ra-name')||{}).value||rosterAi.name;rosterAi.month=($('#ra-month')||{}).value||rosterAi.month;Object.assign(rosterAi,{file:f||null,url:f?URL.createObjectURL(f):null,res:null,err:''});render();}
  else if(t.id==='ra-name'){rosterAi.name=t.value;}
  else if(t.id==='ra-month'){rosterAi.month=t.value;}
  else if(t.classList.contains('ra-sel')){const x=rosterAi.res.days[Number(t.dataset.i)];x.shift=t.value;x.unsure=false;}
  else if(t.id==='menu-sel'){setDay(selDate,{menu:/^cm_/.test(t.value)?t.value:Number(t.value)});commit();}
  else if(t.classList.contains('ai-role')){aiMenu.res.ingredients[Number(t.dataset.i)].role=t.value;}
  else if(t.classList.contains('ai-n')){const g=aiMenu.res.ingredients[Number(t.dataset.i)];const v=Math.max(0,Number(t.value)||0);if(t.dataset.f==='grams')g.grams=Math.round(v);else g.per100[t.dataset.f]=v;checkIng(g);render();}
  else if(t.id==='rice-sel'){setDay(selDate,{rice:t.value});commit();}
  else if(t.classList.contains('slot-sel')){setDay(selDate,{[t.dataset.slot]:t.value});commit();}
  else if(t.id==='drink-add'){if(t.value){const d=dayChoice(state,selDate);setDay(selDate,{drinks:d.drinks.concat(t.value)});commit();}}
  else if((t.id==='meat-sel'||t.classList.contains('wk-meat'))&&t.value==='__ai'){const d=t.dataset.date||selDate;meatAi.date=d;if(t.dataset.date)selDate=d;const q=(t.dataset.q||'').trim();if(q)runMeatAi(q);else{meatAi.open=true;render();const el=document.getElementById('meatai');if(el){el.scrollIntoView({behavior:'smooth',block:'center'});const i=document.getElementById('meatai-q');if(i)i.focus();}}}
  else if(t.id==='meat-sel'){setDay(selDate,{meat:t.value});commit();}
  else if(t.classList.contains('wk-meat')){setDay(t.dataset.date,{meat:t.value});commit();}
  else if(t.classList.contains('mai-n')){if(meatAi.res){const v=Math.max(0,Number(t.value)||0);meatAi.res[t.dataset.f]=t.dataset.f==='price'?Math.round(v):v;meatAiCheck(meatAi.res);const nm=document.getElementById('mai-name');if(nm)meatAi.res.name=nm.value;render();}}
  else if(t.id==='fp-on'){const f=state.profile.fixedPortion=Object.assign({},state.profile.fixedPortion||{});f.on=t.checked;if(f.on&&!(f.meat>0)){const v=freePortion(state,selDate)||weekFreePortion(state,selDate);if(v){f.meat=v.meat;f.rice=v.rice;}}commit();}
  else if(t.id==='fp-meat'||t.id==='fp-rice'){const v=Number(t.value);if(t.value===''||!(v>=0)){render();return;}const f=state.profile.fixedPortion=Object.assign({on:true},state.profile.fixedPortion||{});f[t.id==='fp-meat'?'meat':'rice']=r5(v);commit();}
  else if(t.classList.contains('eat-sel')){const L=eatGet(eatDate);const s=t.dataset.slot;L[s]={id:t.value,x:L[s]&&L[s].x?L[s].x:1};commit();}
  else if(t.classList.contains('eat-x')){const L=eatGet(eatDate);const s=t.dataset.slot;const x=Number(t.value);if(s==='dr')L.dr={x};else L[s]={id:L[s]?L[s].id:(dayChoice(state,eatDate)[s]||''),x};commit();}
  else if(t.classList.contains('eat-xx')){const e=eatGet(eatDate).extra[Number(t.dataset.i)];if(e)e.x=Number(t.value);commit();}
  else if(t.id==='eat-add'){if(t.value){eatAdd(eatDate,t.value);commit();toast('เพิ่มในบันทึกการกินแล้ว');}}
  else if(t.id==='if-quick'||t.id==='if-mode'){const c=state.profile.ifast=state.profile.ifast||{};c.mode=t.value;commit();}
  else if(t.id==='if-skip'){const c=state.profile.ifast=state.profile.ifast||{};c.skipLong=t.checked;commit();}
  else if(t.classList.contains('if-start')){const c=state.profile.ifast=state.profile.ifast||{};c.start=Object.assign({},c.start||{},{[t.dataset.sh]:t.value||IF_START[t.dataset.sh]});commit();}
  else if(t.id==='px-quick'){state.profile.proteinX=Number(t.value);commit();}
  else if(t.id==='d-pick'){if(t.value){selDate=t.value;render();}}
  else if(t.classList.contains('weigh')){(state.weighed[selDate]=state.weighed[selDate]||{});if(t.value==='')delete state.weighed[selDate][t.dataset.k];else state.weighed[selDate][t.dataset.k]=Number(t.value);commit();}
  else if(t.classList.contains('price-g')||t.classList.contains('price-p')){const k=t.dataset.k;const cur=Object.assign({},ING[k].buy,state.prices[k]||{});const v=Number(t.value);if(!(v>0||(t.classList.contains('price-p')&&v===0)))return;if(t.classList.contains('price-g'))cur.g=v;else cur.price=v;state.prices[k]={g:cur.g,price:cur.price,label:cur.label,src:'u'};commit();}
  else if(t.id==='file-in'){importFiles([...t.files]);}
  else if(t.id==='photo-in'){const f=t.files&&t.files[0];if(photo.url)URL.revokeObjectURL(photo.url);photo={file:f||null,url:f?URL.createObjectURL(f):null,busy:false,res:null,err:''};render();}
});
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.del){const [d,j]=t.dataset.del.split('|');state.ex[d].splice(Number(j),1);commit();}
  else if(t.dataset.wdel){state.weights=state.weights.filter(x=>x.d!==t.dataset.wdel);commit();}
  else if(t.dataset.drdel!=null){const d=dayChoice(state,selDate);const arr=d.drinks.slice();arr.splice(Number(t.dataset.drdel),1);setDay(selDate,{drinks:arr});commit();}
  else if(t.dataset.cdel){state.custom=state.custom.filter(c=>c.id!==t.dataset.cdel);commit();}
  else if(t.dataset.cat!=null&&t.closest('.seg')){catFilter=t.dataset.cat;render();}
  else if(t.dataset.photoUse){usePhoto(t.dataset.photoUse);}
  else if(t.id==='photo-go'){runPhoto();}
  else if(t.dataset.rdate){recipeDate=t.dataset.rdate;render();}
  else if(t.dataset.rshift){recipeDate=addDays(recipeDate,Number(t.dataset.rshift));render();}
  else if(t.id==='gen-steps'){genSteps(t.dataset.mid);}
  else if(t.id==='rep-gmail'){sendReportGmail();}
  else if(t.id==='rep-dl'){downloadReport();}
  else if(t.id==='rep-copy'){copy(weekReport(reportWeek).body);}
  else if(t.id==='rep-prev'){reportWeek=addDays(reportWeek,-7);reportMsg='';render();}
  else if(t.id==='rep-next'){reportWeek=addDays(reportWeek,7);reportMsg='';render();}
  else if(t.id==='ra-go'){runRosterAi();}
  else if(t.id==='ra-apply'){for(const x of rosterAi.res.days)state.shifts[x.date]=x.shift;const n=rosterAi.res.days.length;rosterWeek=mondayOf(rosterAi.res.days[0].date);if(rosterAi.url)URL.revokeObjectURL(rosterAi.url);Object.assign(rosterAi,{file:null,url:null,res:null,err:''});commit();toast('ใส่เวรแล้ว '+n+' วัน');}
  else if(t.id==='ra-cancel'){Object.assign(rosterAi,{res:null,err:''});render();}
  else if(t.dataset.pick){selDate=t.dataset.pick;render();const el=document.querySelector('.slots');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});}
  else if(t.id==='wkp-prev'){selDate=addDays(selDate,-7);shopWeek=mondayOf(selDate);render();}
  else if(t.id==='wkp-next'){selDate=addDays(selDate,7);shopWeek=mondayOf(selDate);render();}
  else if(t.id==='wk-auto'){autoWeek(mondayOf(selDate));commit();toast('จัดเมนู 7 วันแล้ว เปลี่ยนรายวันได้');}
  else if(t.id==='wk-copyprev'){const wk=mondayOf(selDate);for(let i=0;i<7;i++){const p=(state.days[addDays(wk,i-7)]||{});const m=menuIdFor(state,addDays(wk,i-7));setDay(addDays(wk,i),{menu:m,...(p.rice?{rice:p.rice}:{})});}commit();toast('ใช้เมนูชุดเดียวกับสัปดาห์ก่อนแล้ว');}
  else if(t.id==='wk-rice-all'){const wk=mondayOf(selDate);for(let i=0;i<7;i++)setDay(addDays(wk,i),{rice:state.profile.rice||'brown'});commit();}
  else if(t.id==='aimenu-save'){saveAiMenu();}
  else if(t.id==='aimenu-cancel'){aiMenu={busy:false,res:null,err:'',q:''};render();}
  else if(t.dataset.mdel){state.customMenus=state.customMenus.filter(m=>m.id!==t.dataset.mdel);for(const k in state.days){if(state.days[k].menu===t.dataset.mdel)delete state.days[k].menu;}commit();toast('ลบเมนูแล้ว');}
  else if(t.classList.contains('add-ex')){dlgDate=t.dataset.date;$('#exdlg-title').textContent='เพิ่มการออกกำลัง · '+thDate(dlgDate);$('#dlg-kcal').value='';const dl=$('#exdlg');if(dl.showModal)dl.showModal();else dl.setAttribute('open','');}
  else if(t.id==='dlg-cancel'){$('#exdlg').close();}
  else if(t.id==='wk-prev'){rosterWeek=addDays(rosterWeek,-7);render();}
  else if(t.id==='wk-next'){rosterWeek=addDays(rosterWeek,7);render();}
  else if(t.id==='copy-week'){for(let i=0;i<7;i++){const s=state.shifts[addDays(rosterWeek,i)];if(s)state.shifts[addDays(rosterWeek,i+7)]=s;}commit();toast('คัดลอกเวรแล้ว');}
  else if(t.id==='d-prev'){selDate=addDays(selDate,-1);render();}
  else if(t.id==='d-next'){selDate=addDays(selDate,1);render();}
  else if(t.id==='meatai-open'){meatAi.open=true;meatAi.date=selDate;render();const i=document.getElementById('meatai-q');if(i)i.focus();}
  else if(t.id==='meatai-close'){meatAi={open:false,busy:false,q:'',res:null,err:'',date:null};render();}
  else if(t.id==='meatai-use'){saveMeatAi(true);}
  else if(t.id==='meatai-save'){saveMeatAi(false);}
  else if(t.dataset.meatdel){const k=t.dataset.meatdel;delete state.customMeats[k];commit();toast('ลบแล้ว วันที่เคยใช้จะกลับไปใช้ตามสูตร');}
  else if(t.id==='fp-today'){const v=freePortion(state,selDate);if(!v){toast('วันนี้ไม่ได้ทำกล่องเอง ลองเลือกวันอื่น');return;}state.profile.fixedPortion={on:true,meat:v.meat,rice:v.rice};commit();toast(`ทุกวัน: เนื้อสัตว์ ${v.meat} ก. ข้าวสุก ${v.rice} ก.`);}
  else if(t.id==='fp-week'){const v=weekFreePortion(state,selDate);if(!v){toast('สัปดาห์นี้ไม่มีวันที่ทำกล่องเอง');return;}state.profile.fixedPortion={on:true,meat:v.meat,rice:v.rice};commit();toast(`ทุกวัน: เนื้อสัตว์ ${v.meat} ก. ข้าวสุก ${v.rice} ก.`);}
  else if(t.dataset.eat){eatToggle(eatDate,t.dataset.eat);commit();}
  else if(t.dataset.eatdel!=null){eatGet(eatDate).extra.splice(Number(t.dataset.eatdel),1);commit();}
  else if(t.id==='eat-prev'){eatDate=addDays(eatDate,-1);render();}
  else if(t.id==='eat-next'){eatDate=addDays(eatDate,1);render();}
  else if(t.id==='eat-today'){eatDate=TODAY;render();}
  else if(t.id==='eat-allplan'){eatAllPlan(eatDate);commit();toast('บันทึกว่ากินตามแผนแล้ว');}
  else if(t.id==='weigh-toggle'){weighMode=!weighMode;render();}
  else if(t.id==='weigh-clear'){delete state.weighed[selDate];commit();}
  else if(t.id==='scale-connect'){if(!scale.connected)connectScale();}
  else if(t.id==='scale-tare'){scale.offset+=scale.grams||0;scale.grams=0;const el=$('#scale-live');if(el)el.textContent=0;}
  else if(t.classList.contains('use-scale')){if(scale.grams==null){toast('ยังไม่ได้ค่าจากตาชั่ง');return;}(state.weighed[selDate]=state.weighed[selDate]||{})[t.dataset.k]=scale.grams;commit();}
  else if(t.id==='copy-shop'){const {W,groups}=shopData(shopWeek);copy(`วัตถุดิบ ${thDate(shopWeek,false)} – ${thDate(addDays(shopWeek,6),false)}\n`+groups.map(G=>G.t+'\n'+G.rows.map(r=>`- ${ING[r.k].t}: ${kgText(r.g,r.k)}`).join('\n')).join('\n\n')+`\n\nค่าวัตถุดิบ ${baht(W.use)}`);}
  else if(t.id==='shop-img'){t.disabled=true;t.textContent='กำลังสร้างรูป…';saveShopImage();}
  else if(t.id==='shop-prev'){shopWeek=addDays(shopWeek,-7);shopImg=null;render();}
  else if(t.id==='shop-next'){shopWeek=addDays(shopWeek,7);shopImg=null;render();}
  else if(t.dataset.chk){const s=(state.shopChecked=state.shopChecked||{});const m=(s[shopWeek]=s[shopWeek]||{});m[t.dataset.chk]=!m[t.dataset.chk];commit();}
  else if(t.id==='shop-uncheck'){if(state.shopChecked)delete state.shopChecked[shopWeek];commit();}
  else if(t.id==='price-reset'){state.prices={};commit();toast('กลับไปใช้ราคาตั้งต้นแล้ว');}
  else if(t.id==='apply-adv'){state.adjust=(state.adjust||0)+Number(t.dataset.v);commit();toast('ปรับพลังงานแล้ว');}
  else if(t.id==='hr-connect'){if(!hr.connected)connectHR();}
  else if(t.id==='hr-start'){toggleHR();}
  else if(t.id==='exp'){copy(JSON.stringify(state));}
  else if(t.id==='imp-show'){$('#imp-box').hidden=false;}
  else if(t.id==='imp-do'){try{state=merge(JSON.parse($('#imp-text').value));commit();toast('กู้คืนข้อมูลแล้ว');}catch(err){toast('ข้อความไม่ใช่ข้อมูลสำรองของแอปนี้');}}
  else if(t.id==='reset'){$('#reset-box').hidden=false;}
  else if(t.id==='reset-no'){$('#reset-box').hidden=true;}
  else if(t.id==='reset-yes'){state=defaults();state.sample=false;save();render();toast('เริ่มใหม่แล้ว');}
});
async function copy(text){try{await navigator.clipboard.writeText(text);toast('คัดลอกแล้ว');}catch(e){toast('คัดลอกไม่ได้ในหน้านี้');}}
document.addEventListener('pointermove',e=>{
  const tip=$('#tip');const h=e.target.closest&&e.target.closest('rect.hit');
  if(!h){tip.style.opacity=0;return;}
  const svg=h.ownerSVGElement;const box=svg.getBoundingClientRect();const sc=box.width/svg.viewBox.baseVal.width;
  tip.textContent=h.dataset.tip;tip.style.left=(box.left+window.scrollX+Number(h.dataset.x)*sc)+'px';tip.style.top=(box.top+window.scrollY+Number(h.dataset.y)*sc-6)+'px';tip.style.opacity=1;
});
setInterval(()=>{if(route()==='today'&&ifCfg(state).mode!=='off'&&!document.querySelector('#view :focus'))render();},60000);
setInterval(()=>{if(hr.running){const el=$('#hr-live');if(el)el.innerHTML=hrLiveText();}},5000);
render(); initStore();
